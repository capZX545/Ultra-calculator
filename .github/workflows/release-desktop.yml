name: App release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      tag:
        description: "Release tag (for example v1.8.0)"
        required: false
        default: "v1.8.0"

permissions:
  contents: write

jobs:
  desktop:
    name: Desktop ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    continue-on-error: ${{ matrix.optional }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            artifact: windows
            optional: false
          - os: ubuntu-22.04
            artifact: linux
            optional: false
          - os: macos-13
            artifact: macos
            optional: true
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install Python packages
        run: |
          python -m pip install --upgrade pip
          python -m pip install pyinstaller numpy scipy sympy

      - name: Freeze the desktop app
        run: python -m PyInstaller desktop/packaging/UltraCalculator.spec --noconfirm --clean

      - name: Windows installer
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          choco install innosetup -y
          & "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe" desktop\packaging\windows\setup.iss
          Compress-Archive -Path dist\UltraCalculator\* -DestinationPath dist\UltraCalculator-Windows.zip -Force

      - name: Linux archive
        if: runner.os == 'Linux'
        run: |
          cp desktop/packaging/linux/install.sh dist/UltraCalculator/install.sh
          chmod +x dist/UltraCalculator/install.sh dist/UltraCalculator/UltraCalculator
          cp desktop/packaging/icon.png dist/UltraCalculator/icon.png
          tar -C dist -czf dist/UltraCalculator-Linux.tar.gz UltraCalculator

      - name: macOS archive
        if: runner.os == 'macOS'
        run: |
          chmod +x dist/UltraCalculator/UltraCalculator || true
          ditto -c -k --sequesterRsrc --keepParent dist/UltraCalculator dist/UltraCalculator-macOS.zip

      - uses: actions/upload-artifact@v4
        with:
          name: desktop-${{ matrix.artifact }}
          if-no-files-found: error
          path: |
            dist/UltraCalculator-Setup-*.exe
            dist/UltraCalculator-Windows.zip
            dist/UltraCalculator-Linux.tar.gz
            dist/UltraCalculator-macOS.zip

  android:
    name: Android APK
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - name: Stage APK
        run: |
          test -f UltraCalculator.apk
          cp UltraCalculator.apk UltraCalculator-Android.apk
          ls -lh UltraCalculator-Android.apk
      - uses: actions/upload-artifact@v4
        with:
          name: android-apk
          if-no-files-found: error
          path: UltraCalculator-Android.apk

  release:
    needs: [desktop, android]
    if: always() && needs.android.result == 'success'
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          path: artifacts
          merge-multiple: true

      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -e
          TAG="${GITHUB_REF_NAME}"
          if [ "$GITHUB_EVENT_NAME" = "workflow_dispatch" ]; then
            TAG="${{ github.event.inputs.tag || github.ref_name }}"
          fi
          if ! echo "$TAG" | grep -q '^v'; then
            TAG="v1.8.0"
          fi
          VER="${TAG#v}"
          if [ -f artifacts/UltraCalculator-Android.apk ]; then
            mv artifacts/UltraCalculator-Android.apk "artifacts/UltraCalculator-${VER}.apk"
          fi
          NOTES="$(cat <<EOF
          Desktop and Android ${TAG}.

          **Windows:** run \`UltraCalculator-Setup-${VER}.exe\`. It installs for your user (no admin). A desktop shortcut is optional. Or unzip \`UltraCalculator-Windows.zip\` and run \`UltraCalculator.exe\`.

          **Android:** install \`UltraCalculator-${VER}.apk\`. Uninstall an older build first if the installer refuses it.

          **Linux:** unpack \`UltraCalculator-Linux.tar.gz\` and run \`./install.sh\`, or run \`./UltraCalculator\` from the folder.

          **macOS:** unzip and run \`UltraCalculator\` if that archive is attached.

          Same calculator: formulas, circuits (two parts, then series or parallel), sequences, problems, chemistry.
          EOF
          )"
          FILES=$(find artifacts -type f \( -name '*.exe' -o -name '*.zip' -o -name '*.tar.gz' -o -name '*.apk' \) 2>/dev/null || true)
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release upload "$TAG" $FILES --clobber
          else
            gh release create "$TAG" $FILES --title "Desktop and Android ${TAG}" --notes "$NOTES"
          fi
